[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportstrades"
version = "0.1.0"
description = "Simulated cross-venue arbitrage scanner: Kalshi vs Polymarket vs sportsbook odds"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arb = "arb.cli:main"

[tool.setuptools]
packages = ["arb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
