# Cloud paper trader.
#
# Runs the scanner on GitHub's servers so it keeps going when your laptop sleeps.
# Each run: scan both venues -> paper-trade anything profitable after fees ->
# settle finished games -> publish the ledger.
#
# State lives on the orphan branch `ledger`, force-pushed as a single commit each
# run, so the repository never grows with binary history. The same database is
# also uploaded as a build artifact each run, which gives you 30 days of rollback.
#
# Cadence, measured rather than assumed: the cron below asks for every 10 minutes,
# but GitHub delivers roughly one scheduled run every 1-2 hours. Scheduled
# workflows on shared runners are dropped under load, and asking more often does
# not make them arrive more often. The workflow is "active" and healthy; this is
# simply what the shared scheduler gives out.
#
# So rather than rely on the cron frequency, each run that *does* fire performs
# several scans back to back. That is the part we control. Roughly 12 runs a day
# times 4 scans is ~50 samples a day instead of ~12.
#
# For a genuinely fixed cadence you need something that is not a CI scheduler:
# a small always-on box, or an external cron service hitting the workflow_dispatch
# API. Self-re-dispatch from inside the workflow does not work, because runs
# triggered with GITHUB_TOKEN are blocked from triggering further runs.

name: paper trader

on:
  schedule:
    - cron: '*/10 * * * *'   # asks for 10 min; GitHub actually delivers every 1-2 h
  workflow_dispatch:
    inputs:
      leagues:
        description: 'League set: all (13 majors), niche, everything, or a comma list'
        default: 'all'
        type: string
      settle_only:
        description: 'Only settle finished games, do not scan'
        default: false
        type: boolean

concurrency:
  group: paper-trader        # never let two runs write the ledger at once
  cancel-in-progress: false

permissions:
  contents: write            # to push the ledger branch
  pages: write               # to publish the dashboard
  id-token: write            # required by actions/deploy-pages

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # room for the multi-scan loop; still caps a hung venue API
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      PAPER_DB: ${{ github.workspace }}/data/cloud.db
      PAPER_BANKROLL: '10000'
      PAPER_MAX_PER_TRADE: '500'
      PAPER_MAX_PER_KEY: '1000'
      PAPER_MIN_MARGIN: '0.005'
      KALSHI_RATE: '4'       # gentler than local: shared runners get rate-limited harder
      CLOB_RATE: '6'
      LEAGUES: ${{ inputs.leagues || 'all' }}
      SCANS_PER_RUN: '4'       # GitHub decides how often we run; we decide how much each run does

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: pip install -q -e .

      - name: Restore ledger
        run: |
          mkdir -p data
          if git fetch --depth=1 origin ledger 2>/dev/null; then
            git show FETCH_HEAD:cloud.db > data/cloud.db
            echo "restored ledger: $(du -h data/cloud.db | cut -f1)"
          else
            echo "no ledger branch yet, starting a fresh one"
          fi

      - name: Scan and paper-trade
        if: ${{ inputs.settle_only != true }}
        run: |
          arb run --leagues "$LEAGUES" --max-scans "$SCANS_PER_RUN" --interval 60 \
                  --settle-every 999 --no-quotes --keep-days 14 \
                  --status-file data/status.json

      - name: Settle finished games
        run: arb settle

      - name: Build ledger summary and dashboard
        run: |
          arb report --markdown ledger/STATUS.md
          python docs/build_dashboard.py --db "$PAPER_DB" --out site/index.html \
                 --bankroll "$PAPER_BANKROLL"
          cat ledger/STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish ledger
        run: |
          work="$(mktemp -d)"
          cp data/cloud.db "$work/cloud.db"
          cp ledger/STATUS.md "$work/STATUS.md"
          [ -f data/status.json ] && cp data/status.json "$work/status.json"
          cd "$work"
          git init -q -b ledger
          git config user.name  'sportstrades bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "ledger $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ledger
          echo "ledger published: $(du -h cloud.db | cut -f1)"

      - name: Publish dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: pages
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ github.run_number }}
          path: |
            data/cloud.db
            data/status.json
            ledger/STATUS.md
          retention-days: 30
